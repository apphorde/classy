<!doctype html>
<html lang="en" class="bg-[#fafafa]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A visual navigator for your private media archive." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
    <title>Classy / Private Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">{ "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }</script>
    <script type="module">import '@li3/web';</script>
  </head>
  <body class="min-h-screen overflow-x-hidden bg-[#fafafa] text-[#262626] antialiased selection:bg-[#cce8ff]">
    <template app>
      <main class="mx-auto min-h-screen max-w-[1200px] px-0 pb-16 sm:px-5">
        <header class="sticky top-0 z-40 flex h-[60px] items-center justify-between border-b border-[#dbdbdb] bg-white px-4 sm:px-0">
          <a href="/" aria-label="Classy home" class="flex items-center gap-2.5"><span class="grid size-8 place-items-center rounded-full bg-gradient-to-br from-[#ffdc80] via-[#e1306c] to-[#833ab4] text-sm font-bold text-white">C</span><span class="font-serif text-[22px] font-semibold tracking-tight">Classy</span></a>
          <label class="relative hidden w-[268px] md:block"><span class="sr-only">Search</span><svg class="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-[#737373]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input ref="searchInput" on-input="onSearch($event)" type="search" placeholder="Search" class="h-9 w-full rounded-lg bg-[#efefef] pl-9 pr-3 text-sm outline-none placeholder:text-[#737373] focus:bg-[#e5e5e5]" /></label>
          <span class="text-xs text-[#737373]">{{ total }} files</span>
        </header>

        <div class="grid grid-cols-1 gap-8 lg:grid-cols-[220px_minmax(0,630px)_220px] lg:items-start lg:justify-center">
          <aside class="sticky top-[84px] hidden self-start lg:block"><nav class="space-y-1 text-sm"><button on-click="close()" class="flex w-full items-center gap-4 rounded-lg px-3 py-3 font-semibold hover:bg-[#efefef]"><svg class="size-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"></path><path d="M9 21v-6h6v6"></path></svg>Home</button><button on-click="focusSearch()" class="flex w-full items-center gap-4 rounded-lg px-3 py-3 hover:bg-[#efefef]"><lucide-icon icon="search" size="22" icon-classes="size-[22px]"></lucide-icon>Search</button><button on-click="toggleFilters()" class="flex w-full items-center gap-4 rounded-lg px-3 py-3 hover:bg-[#efefef]"><lucide-icon icon="sliders-horizontal" size="22" icon-classes="size-[22px]"></lucide-icon>Filters</button><button on-click="toggleFaces()" class="flex w-full items-center gap-4 rounded-lg px-3 py-3 hover:bg-[#efefef]"><lucide-icon icon="scan-face" size="22" icon-classes="size-[22px]"></lucide-icon>People</button></nav><div class="mt-10 border-t border-[#dbdbdb] px-3 pt-5"><p class="text-xs font-semibold text-[#737373]">Private archive</p><p class="mt-2 text-xs leading-5 text-[#737373]">{{ total }} indexed files<br />{{ scanStatusLabel }} index</p></div></aside>

          <section class="min-w-0">
            <div class="border-b border-[#dbdbdb] bg-white px-4 py-3 sm:mt-5 sm:rounded-lg sm:border"><div class="flex items-center gap-2"><label class="relative min-w-0 flex-1 md:hidden"><span class="sr-only">Search</span><svg class="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-[#737373]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input ref="mobileSearchInput" on-input="onSearch($event)" type="search" placeholder="Search" class="h-9 w-full rounded-lg bg-[#efefef] pl-9 pr-3 text-sm outline-none placeholder:text-[#737373]" /></label><button on-click="toggleFilters()" title="Filters" class="grid size-9 shrink-0 place-items-center rounded-full text-[#737373] hover:bg-[#efefef]"><lucide-icon icon="sliders-horizontal" size="18" icon-classes="size-4"></lucide-icon><span class="sr-only">Filters</span></button></div><template if="filtersOpen"><div class="mt-3 flex gap-2 overflow-x-auto border-t border-[#efefef] pt-3"><button on-click="setType('all')" class="rounded-full px-3 py-1.5 text-xs font-semibold">All</button><button on-click="setType('photo')" class="rounded-full px-3 py-1.5 text-xs font-semibold">Images</button><button on-click="setType('video')" class="rounded-full px-3 py-1.5 text-xs font-semibold">Video</button><button on-click="setType('audio')" class="rounded-full px-3 py-1.5 text-xs font-semibold">Audio</button><button on-click="toggleFaces()" class="rounded-full px-3 py-1.5 text-xs font-semibold">Faces</button></div></template></div>

            <template if="!previewMode"><div class="grid grid-cols-3 gap-1 py-5 sm:gap-3"><template for="item of items"><article on-click="open(item)" class="relative aspect-square cursor-pointer overflow-hidden bg-[#efefef]"><template if="item.type === 'photo' || item.type === 'video'"><img loading="lazy" attr-src="item.thumbnailUrl || item.contentUrl" attr-alt="item.name" class="size-full object-cover" /></template><template if="item.type !== 'photo' && item.type !== 'video'"><div class="grid size-full place-items-center text-[#737373]"><span class="text-4xl">{{ typeGlyph(item.type) }}</span></div></template><template if="item.faceCount"><span class="absolute right-2 top-2 grid size-6 place-items-center rounded-full bg-white/90"><lucide-icon icon="scan-face" size="13" icon-classes="size-3"></lucide-icon></span></template></article></template></div></template>
            <template if="loading"><div class="grid grid-cols-3 gap-1 py-5 sm:gap-3"><div class="aspect-square animate-pulse bg-[#efefef]"></div><div class="aspect-square animate-pulse bg-[#efefef]"></div><div class="aspect-square animate-pulse bg-[#efefef]"></div></div></template>
          </section>

          <aside class="sticky top-[84px] hidden self-start lg:block"><p class="text-sm font-semibold">Private archive</p><p class="mt-1 text-xs text-[#737373]">Your personal collection</p><p class="mt-7 text-xs leading-5 text-[#737373]">Search any tag, category, filename, or description. Use Faces to find detected people.</p><label class="mt-5 block text-xs font-semibold">Face groups<select on-change="filterGroup($event)" class="mt-2 w-full rounded-lg border border-[#dbdbdb] bg-white px-2 py-2 text-xs font-normal"><option value="">All groups</option><template for="group of groups"><option attr-value="group.id">{{ group.label || `Group ${group.id}` }} ({{ group.faceCount }})</option></template></select></label><div class="mt-5 space-y-1"><template for="group of groups.slice(0, 8)"><button on-click="renameGroup(group)" class="block w-full truncate rounded px-2 py-1 text-left text-xs text-[#737373] hover:bg-[#efefef]">{{ group.label || `Group ${group.id}` }}</button></template></div></aside>
        </div>

        <template if="previewMode"><section ref="previewScroller" on-scroll="onPreviewScroll($event)" class="relative z-10 min-h-screen snap-y snap-mandatory overflow-y-auto bg-white scroll-smooth"><div class="sticky top-0 z-20 flex justify-end border-b border-[#dbdbdb] bg-white/90 px-4 py-3 backdrop-blur-xl"><button on-click="close()" class="rounded-full border border-[#dbdbdb] bg-white px-4 py-2 text-xs font-semibold">Grid</button></div><template for="[item, index] of items"><article attr-data-preview-index="index" class="grid min-h-[calc(100vh-53px)] snap-start place-items-center bg-white px-4 py-8 sm:px-10"><div class="w-full max-w-[600px] overflow-hidden rounded-lg border border-[#dbdbdb] bg-white shadow-sm"><div class="flex items-center gap-3 border-b border-[#efefef] px-4 py-3"><div class="min-w-0"><p class="truncate text-sm font-semibold">{{ item.name }}</p><p class="truncate text-xs text-[#737373]">{{ item.type }} · {{ item.category }}</p></div><span class="ml-auto text-xs text-[#737373]">{{ index + 1 }} / {{ items.length }}</span></div><div class="relative flex aspect-square items-center justify-center bg-black"><template if="item.type === 'photo'"><img loading="lazy" attr-src="item.contentUrl" attr-alt="item.name" class="max-h-full max-w-full object-contain" /></template><template if="item.type === 'video'"><video controls preload="metadata" attr-src="item.contentUrl" class="max-h-full max-w-full"></video></template><template if="item.type !== 'photo' && item.type !== 'video'"><span class="text-6xl text-white/60">{{ typeGlyph(item.type) }}</span></template><template if="item.faceCount"><button on-click.stop="showFaces(item)" class="absolute right-3 top-3 rounded-full bg-white/90 px-2 py-1 text-xs font-semibold">{{ item.faceCount }} faces</button></template><template if="activeFaces && activeFaces.item.id === item.id"><div class="absolute right-3 top-12 z-10 w-48 rounded-lg border border-[#dbdbdb] bg-white p-3 text-xs shadow-xl"><p class="font-semibold">Detected faces</p><template for="face of activeFaces.faces"><p class="mt-2 text-[#737373]">Face {{ face.index + 1 }} · {{ Math.round(face.detectionScore * 100) }}% confidence</p></template><button on-click="clearFaces()" class="mt-3 font-semibold text-[#0095f6]">Close</button></div></template></div><div class="p-4"><div class="flex items-center gap-4"><button on-click="toggleFavorite(item)" title="Favorite" class-text-blue="isFavorite(item)"><lucide-icon icon="star" size="22" icon-classes="size-[22px]"></lucide-icon><span class="sr-only">Favorite</span></button><button disabled title="Share coming soon" class="text-[#737373]"><lucide-icon icon="send" size="22" icon-classes="size-[22px]"></lucide-icon><span class="sr-only">Share coming soon</span></button></div><p class="mt-3 text-sm leading-5">{{ item.summary }}</p><div class="mt-2 flex flex-wrap gap-x-2 text-sm text-[#00376b]"><template for="tag of item.tags"><button on-click.stop="filterTag(tag)" class="hover:underline">#{{ tag }}</button></template></div><button on-click="rescanSelected()" class="mt-4 text-xs font-semibold text-[#0095f6]">Rescan file</button></div></div></article></template></section></template>

        <script setup>
          import { ref, computed, templateRef, onInit, onDestroy } from '@li3/web';
          export default function () {
            const items = ref([]); const total = ref(0); const loading = ref(true); const selected = ref(null); const previewMode = ref(true); const query = ref(''); const type = ref('all'); const facesOnly = ref(false); const groupId = ref(''); const groups = ref([]); const filtersOpen = ref(false); const activeFaces = ref(null); const favoriteIds = ref([]); const status = ref(null); const searchInput = templateRef('searchInput'); const mobileSearchInput = templateRef('mobileSearchInput'); const previewScroller = templateRef('previewScroller'); let searchTimer;
            const scanStatusLabel = computed(() => status.value?.running ? 'Scanning' : status.value?.failed ? 'Review' : 'Ready');
            async function load() { loading.value = true; const params = new URLSearchParams({ limit: '60' }); if (query.value) params.set('search', query.value); if (type.value !== 'all') params.set('type', type.value); if (facesOnly.value) params.set('faces', '1'); if (groupId.value) params.set('face_group', groupId.value); try { const response = await fetch(`/api/media?${params}`); const data = await response.json(); items.value = data.items; total.value = data.total; } finally { loading.value = false; setTimeout(compactPreview, 50); } }
            async function refresh() { const response = await fetch('/api/status'); if (response.ok) status.value = await response.json(); const groupsResponse = await fetch('/api/face-groups'); if (groupsResponse.ok) groups.value = (await groupsResponse.json()).groups; await load(); }
            function onSearch(event) { query.value = event.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(load, 250); }
            function setType(value) { type.value = value; load(); } function toggleFaces() { facesOnly.value = !facesOnly.value; load(); } function filterGroup(event) { groupId.value = event.target.value; load(); } function toggleFilters() { filtersOpen.value = !filtersOpen.value; } function focusSearch() { (searchInput.value || mobileSearchInput.value)?.focus(); } function close() { selected.value = null; previewMode.value = false; }
            function open(item) { selected.value = item; previewMode.value = true; const index = items.value.findIndex((entry) => entry.id === item.id); setTimeout(() => previewScroller.value?.querySelector(`[data-preview-index="${index}"]`)?.scrollIntoView({ block: 'start' }), 50); }
            function onPreviewScroll(event) { const page = [...event.target.querySelectorAll('[data-preview-index]')].find((entry) => entry.getBoundingClientRect().top >= 0 && entry.getBoundingClientRect().top < window.innerHeight / 2); if (page) selected.value = items.value[Number(page.dataset.previewIndex)]; }
            function showFaces(item, button) { const fallbackFaces = Array.from({ length: item.faceCount || 0 }, (_, index) => ({ index, detectionScore: 0 })); activeFaces.value = { item, faces: fallbackFaces }; if (button) { const host = button.parentElement; host.querySelector('[data-face-popover]')?.remove(); const popover = document.createElement('div'); popover.dataset.facePopover = 'true'; popover.className = 'absolute right-3 top-12 z-10 w-48 rounded-lg border border-[#dbdbdb] bg-white p-3 text-xs shadow-xl'; popover.innerHTML = `<p class="font-semibold">Detected faces</p>${fallbackFaces.map((face) => `<p class="mt-2 text-[#737373]">Face ${face.index + 1} · ${Math.round(face.detectionScore * 100)}% confidence</p>`).join('')}<button type="button" class="mt-3 font-semibold text-[#0095f6]">Close</button>`; popover.querySelector('button').addEventListener('click', () => { popover.remove(); activeFaces.value = null; }); host.append(popover); } fetch(`/api/media/${item.id}/faces`).then((response) => response.ok ? response.json() : null).then((data) => { if (data) activeFaces.value = { item, faces: data.faces }; }); } function clearFaces() { activeFaces.value = null; document.querySelectorAll('[data-face-popover]').forEach((popover) => popover.remove()); }
            function filterTag(tag) { query.value = tag; filtersOpen.value = false; load(); }
            async function renameGroup(group) { const label = prompt('Name this face group', group.label || ''); if (label === null) return; await fetch(`/api/face-groups/${group.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ label }) }); await refresh(); }
            function compactPreview() { previewScroller.value?.querySelectorAll('[data-preview-index]').forEach((page) => { page.style.minHeight = '0'; page.classList.remove('snap-start'); }); }
            function isFavorite(item) { return favoriteIds.value.includes(item.id); } function toggleFavorite(item) { favoriteIds.value = isFavorite(item) ? favoriteIds.value.filter((id) => id !== item.id) : [...favoriteIds.value, item.id]; }
            async function rescanSelected() { if (selected.value) await fetch(`/api/media/${selected.value.id}/scan`, { method: 'POST' }); }
            function typeGlyph(value) { return { audio: '♪', pdf: '▤', ebook: '▥', unknown: '•' }[value] || '•'; } function formatBytes(value) { if (!value) return '0 B'; const units = ['B', 'KB', 'MB', 'GB']; const index = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1); return `${(value / 1024 ** index).toFixed(index ? 1 : 0)} ${units[index]}`; }
            function delegatedFaceClick(event) { const button = event.target.closest('button'); if (!button || !/^\d+ faces$/.test(button.textContent.trim())) return; const page = button.closest('[data-preview-index]'); const item = page ? items.value[Number(page.dataset.previewIndex)] : null; if (item) showFaces(item, button); }
            onInit(() => { document.addEventListener('click', delegatedFaceClick, true); refresh(); }); onDestroy(() => document.removeEventListener('click', delegatedFaceClick, true)); return { items, total, loading, selected, previewMode, type, facesOnly, groupId, groups, filtersOpen, activeFaces, scanStatusLabel, searchInput, mobileSearchInput, previewScroller, onSearch, setType, toggleFaces, filterGroup, toggleFilters, focusSearch, refresh, open, close, rescanSelected, onPreviewScroll, showFaces, clearFaces, filterTag, renameGroup, isFavorite, toggleFavorite, typeGlyph, formatBytes };
          }
        </script>
      <style>[data-preview-index] { min-height: 0 !important; padding-block: 0 !important; scroll-snap-align: none; }</style>
      </main>
    </template>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  </body>
</html>
