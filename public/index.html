<!doctype html>
<html lang="en" class="bg-[#101214]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101214" />
    <meta name="description" content="A visual navigator for your private media archive." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Classy / Private Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <script type="module">import '@li3/web';</script>
  </head>
  <body class="min-h-screen bg-[#101214] text-[#f4f0e7] antialiased selection:bg-[#d8ff3e] selection:text-[#101214]">
    <template app>
      <main class="mx-auto min-h-screen max-w-[1600px] px-4 py-5 sm:px-8 lg:px-12">
        <header class="flex items-center justify-between border-b border-white/10 pb-5">
          <a href="/" class="flex items-center gap-3" aria-label="Classy home">
            <span class="grid size-9 place-items-center rounded-full bg-[#d8ff3e] text-sm font-black text-[#101214]">C</span>
            <span class="text-sm font-bold uppercase tracking-[0.28em]">Classy</span>
          </a>
          <div class="flex items-center gap-3 text-xs uppercase tracking-[0.18em] text-white/45">
            <span class="hidden sm:inline">Private archive</span>
            <span class="size-1.5 rounded-full bg-[#d8ff3e]"></span>
            <span>Live index</span>
          </div>
        </header>

        <section class="grid gap-8 py-12 lg:grid-cols-[1fr_0.9fr] lg:items-end lg:py-20">
          <div>
            <p class="mb-5 text-xs font-semibold uppercase tracking-[0.3em] text-[#d8ff3e]">A considered collection</p>
            <h1 class="max-w-3xl text-5xl font-semibold leading-[0.95] tracking-[-0.055em] sm:text-7xl lg:text-8xl">Every file has a <span class="text-white/35">place.</span></h1>
          </div>
          <div class="max-w-md justify-self-end lg:pb-1">
            <p class="text-base leading-7 text-white/55">A visual index of the moments, sounds and documents that make up your personal archive.</p>
            <div class="mt-7 flex items-center gap-8 border-t border-white/10 pt-5 text-sm">
              <div><strong class="block text-2xl font-medium text-white">{{ total }}</strong><span class="text-xs uppercase tracking-widest text-white/35">Files found</span></div>
              <div><strong class="block text-2xl font-medium text-white">{{ scanStatusLabel }}</strong><span class="text-xs uppercase tracking-widest text-white/35">Index status</span></div>
            </div>
          </div>
        </section>

        <section class="sticky top-0 z-20 -mx-4 border-y border-white/10 bg-[#101214]/95 px-4 py-4 backdrop-blur-xl sm:-mx-8 sm:px-8 lg:-mx-12 lg:px-12">
          <div class="flex flex-col gap-3 lg:flex-row lg:items-center">
            <label class="relative min-w-0 flex-1">
              <span class="sr-only">Search the archive</span>
              <svg class="pointer-events-none absolute left-4 top-1/2 size-4 -translate-y-1/2 text-white/35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
              <input ref="searchInput" on-input="onSearch($event)" type="search" placeholder="Search names, stories, categories..." class="h-12 w-full rounded-full border border-white/10 bg-white/[0.06] pl-11 pr-4 text-sm text-white outline-none transition placeholder:text-white/30 focus:border-[#d8ff3e]/60 focus:bg-white/[0.09]" />
            </label>
            <div class="flex gap-2 overflow-x-auto pb-1 lg:pb-0">
              <button on-click="setType('all')" bind-class="{ 'bg-[#d8ff3e]': type === 'all', 'text-[#101214]': type === 'all', 'bg-white/10': type !== 'all', 'text-white/45': type !== 'all' }" class="whitespace-nowrap rounded-full px-4 py-2.5 text-xs font-semibold uppercase tracking-widest transition">All</button>
              <button on-click="setType('photo')" bind-class="{ 'bg-[#d8ff3e]': type === 'photo', 'text-[#101214]': type === 'photo', 'text-white/45': type !== 'photo' }" class="whitespace-nowrap rounded-full px-4 py-2.5 text-xs font-semibold uppercase tracking-widest transition hover:bg-white/10 hover:text-white">Images</button>
              <button on-click="setType('video')" bind-class="{ 'bg-[#d8ff3e]': type === 'video', 'text-[#101214]': type === 'video', 'text-white/45': type !== 'video' }" class="whitespace-nowrap rounded-full px-4 py-2.5 text-xs font-semibold uppercase tracking-widest transition hover:bg-white/10 hover:text-white">Video</button>
              <button on-click="setType('audio')" bind-class="{ 'bg-[#d8ff3e]': type === 'audio', 'text-[#101214]': type === 'audio', 'text-white/45': type !== 'audio' }" class="whitespace-nowrap rounded-full px-4 py-2.5 text-xs font-semibold uppercase tracking-widest transition hover:bg-white/10 hover:text-white">Audio</button>
              <button on-click="setType('pdf')" bind-class="{ 'bg-[#d8ff3e]': type === 'pdf', 'text-[#101214]': type === 'pdf', 'text-white/45': type !== 'pdf' }" class="whitespace-nowrap rounded-full px-4 py-2.5 text-xs font-semibold uppercase tracking-widest transition hover:bg-white/10 hover:text-white">Docs</button>
            </div>
            <div class="hidden items-center gap-1 rounded-full border border-white/10 p-1 lg:flex">
              <button on-click="setView('grid')" attr-aria-label="Grid view" bind-class="{ 'bg-white/10 text-white': view === 'grid' }" class="grid size-9 place-items-center rounded-full text-white/40 transition hover:text-white"><svg class="size-4" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path></svg></button>
              <button on-click="setView('list')" attr-aria-label="List view" bind-class="{ 'bg-white/10 text-white': view === 'list' }" class="grid size-9 place-items-center rounded-full text-white/40 transition hover:text-white"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M5 12h14M5 18h14"></path></svg></button>
            </div>
          </div>
        </section>

        <section class="py-8">
          <div class="mb-6 flex items-center justify-between">
            <p class="text-xs uppercase tracking-[0.24em] text-white/35">{{ resultLabel }}</p>
            <button on-click="refresh()" class="flex items-center gap-2 text-xs uppercase tracking-widest text-white/40 transition hover:text-[#d8ff3e]"><svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8.1 8.1 0 0 0-14.8-4L3 10m0-5v5h5M4 13a8.1 8.1 0 0 0 14.8 4L21 14m0 5v-5h-5"></path></svg> Refresh</button>
          </div>

          <template if="loading"><div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
            <div class="h-64 animate-pulse rounded-2xl bg-white/[0.06] sm:h-80"></div><div class="h-64 animate-pulse rounded-2xl bg-white/[0.06] sm:h-80"></div><div class="hidden h-80 animate-pulse rounded-2xl bg-white/[0.06] sm:block"></div><div class="hidden h-80 animate-pulse rounded-2xl bg-white/[0.06] lg:block"></div>
          </div></template>

          <template if="!loading && !items.length"><div class="rounded-3xl border border-dashed border-white/15 px-6 py-24 text-center"><p class="text-2xl font-medium">Nothing here yet.</p><p class="mt-2 text-sm text-white/40">Try a different search or run a new scan.</p></div></template>

          <template if="!loading && items.length && view === 'grid'"><div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
            <template for="item of items">
              <article on-click="open(item)" class="group relative cursor-pointer overflow-hidden rounded-2xl border border-white/10 bg-[#191c1f] transition duration-300 hover:-translate-y-1 hover:border-[#d8ff3e]/40 hover:shadow-[0_18px_50px_rgba(0,0,0,.3)]">
                <div class="relative flex aspect-[0.82] items-center justify-center overflow-hidden bg-[#24282b]">
                  <template if="item.type === 'photo'"><img loading="lazy" attr-src="item.contentUrl" attr-alt="item.name" class="size-full object-cover transition duration-700 group-hover:scale-105" /></template>
                  <template if="item.type === 'video'"><video preload="metadata" muted attr-src="item.contentUrl" class="size-full object-cover opacity-75"></video><span class="absolute grid size-11 place-items-center rounded-full bg-[#d8ff3e] text-[#101214] shadow-xl"><svg class="ml-0.5 size-4" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7V5Z"></path></svg></span></template>
                  <template if="item.type !== 'photo' && item.type !== 'video'"><div class="grid size-16 place-items-center rounded-full border border-white/10 bg-white/[0.04] text-[#d8ff3e]"><span class="text-2xl font-light">{{ typeGlyph(item.type) }}</span></div></template>
                  <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/75 to-transparent"></div>
                  <span class="absolute left-3 top-3 rounded-full bg-black/40 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-widest text-white/75 backdrop-blur">{{ item.type }}</span>
                  <template if="item.metadata.GPSLatitude"><span class="absolute right-3 top-3 grid size-7 place-items-center rounded-full bg-black/40 text-[#d8ff3e] backdrop-blur" title="Has geolocation"><svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"></path><circle cx="12" cy="9" r="2.2"></circle></svg></span></template>
                </div>
                <div class="p-4"><h2 class="truncate text-sm font-medium text-white">{{ item.name }}</h2><div class="mt-2 flex items-center justify-between gap-2 text-[11px] text-white/35"><span class="truncate">{{ item.category }}</span><span>{{ formatBytes(item.size) }}</span></div></div>
              </article>
            </template>
          </div></template>

          <template if="!loading && items.length && view === 'list'"><div class="divide-y divide-white/10 overflow-hidden rounded-2xl border border-white/10 bg-[#191c1f]"><template for="item of items"><button on-click="open(item)" class="flex w-full items-center gap-4 p-4 text-left transition hover:bg-white/[0.05]"><div class="grid size-12 shrink-0 place-items-center overflow-hidden rounded-xl bg-[#24282b]"><template if="item.type === 'photo'"><img attr-src="item.contentUrl" attr-alt="item.name" class="size-full object-cover" /></template><template if="item.type !== 'photo'"><span class="text-[#d8ff3e]">{{ typeGlyph(item.type) }}</span></template></div><span class="min-w-0 flex-1 truncate text-sm">{{ item.name }}</span><span class="hidden w-32 truncate text-xs text-white/35 sm:block">{{ item.category }}</span><span class="w-16 text-right text-xs text-white/35">{{ formatBytes(item.size) }}</span><svg class="size-4 text-white/25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"></path></svg></button></template></div></template>
        </section>

        <footer class="flex flex-col gap-3 border-t border-white/10 py-8 text-xs text-white/30 sm:flex-row sm:items-center sm:justify-between"><span>Classy / Personal archive navigator</span><span>Indexed with care</span></footer>

        <template if="selected"><div class="fixed inset-0 z-50 flex items-end justify-center bg-black/70 p-0 backdrop-blur-sm sm:items-center sm:p-6" on-click.self="close()">
          <section class="flex max-h-[92vh] w-full max-w-5xl flex-col overflow-hidden rounded-t-3xl border border-white/10 bg-[#191c1f] shadow-2xl sm:flex-row sm:rounded-3xl">
            <div class="flex min-h-72 flex-1 items-center justify-center bg-[#0c0e0f] sm:min-h-[600px]">
              <template if="selected.type === 'photo'"><img attr-src="selected.contentUrl" attr-alt="selected.name" class="max-h-[78vh] max-w-full object-contain" /></template>
              <template if="selected.type === 'video'"><video controls autoplay attr-src="selected.contentUrl" class="max-h-[78vh] max-w-full"></video></template>
              <template if="selected.type === 'audio'"><div class="w-full max-w-md px-8"><div class="mb-8 grid aspect-square place-items-center rounded-3xl bg-gradient-to-br from-[#d8ff3e] to-[#77a100] text-[#101214]"><svg class="size-24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="9"></circle><path d="M9 17V8l7-2v9M9 17a2 2 0 1 0 2 2 2 2 0 0 0-2-2Zm7-2a2 2 0 1 0 2 2 2 2 0 0 0-2-2Z"></path></svg></div><audio controls attr-src="selected.contentUrl" class="w-full"></audio></div></template>
              <template if="selected.type !== 'photo' && selected.type !== 'video' && selected.type !== 'audio'"><div class="text-center text-white/30"><div class="text-7xl font-light text-[#d8ff3e]">{{ typeGlyph(selected.type) }}</div><p class="mt-4 text-sm">Preview unavailable</p></div></template>
            </div>
            <aside class="w-full overflow-y-auto border-t border-white/10 p-6 sm:max-w-sm sm:border-l sm:border-t-0 sm:p-8"><div class="flex items-start justify-between gap-4"><div><span class="text-[10px] font-semibold uppercase tracking-[0.25em] text-[#d8ff3e]">{{ selected.type }} / {{ selected.category }}</span><h2 class="mt-3 break-words text-2xl font-medium leading-tight">{{ selected.name }}</h2></div><button on-click="close()" class="grid size-9 shrink-0 place-items-center rounded-full bg-white/10 text-white/60 transition hover:bg-[#d8ff3e] hover:text-[#101214]" aria-label="Close"><svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div><template if="selected.summary"><p class="mt-6 text-sm leading-6 text-white/55">{{ selected.summary }}</p></template><div class="mt-8 grid grid-cols-2 gap-3"><div class="rounded-xl bg-white/[0.05] p-3"><p class="text-[10px] uppercase tracking-widest text-white/30">File size</p><p class="mt-1 text-sm">{{ formatBytes(selected.size) }}</p></div><div class="rounded-xl bg-white/[0.05] p-3"><p class="text-[10px] uppercase tracking-widest text-white/30">Captured</p><p class="mt-1 text-sm">{{ formatDate(selected.date) }}</p></div></div><div class="mt-8"><p class="mb-3 text-[10px] uppercase tracking-widest text-white/30">Metadata</p><dl class="space-y-3 text-xs"><template if="selected.metadata.Make || selected.metadata.Model"><div class="flex justify-between gap-4"><dt class="text-white/35">Camera</dt><dd class="text-right">{{ selected.metadata.Make }} {{ selected.metadata.Model }}</dd></div></template><template if="selected.metadata.ImageWidth"><div class="flex justify-between gap-4"><dt class="text-white/35">Dimensions</dt><dd>{{ selected.metadata.ImageWidth }} × {{ selected.metadata.ImageHeight }}</dd></div></template><div class="flex justify-between gap-4"><dt class="text-white/35">Path</dt><dd class="max-w-[12rem] truncate text-right" attr-title="selected.relativePath">{{ selected.relativePath }}</dd></div></dl></div><template if="selected.metadata.GPSLatitude && selected.metadata.GPSLongitude"><div class="mt-8 overflow-hidden rounded-2xl border border-white/10 bg-[#0c0e0f]"><iframe title="Photo location" class="h-44 w-full grayscale-[.35]" attr-src="mapUrl(selected.metadata.GPSLatitude, selected.metadata.GPSLongitude)"></iframe><a target="_blank" rel="noreferrer" attr-href="mapLink(selected.metadata.GPSLatitude, selected.metadata.GPSLongitude)" class="block border-t border-white/10 px-4 py-3 text-xs text-[#d8ff3e]">Open location in OpenStreetMap ↗</a></div></template></aside>
          </section>
        </div></template>

        <script setup>
          import { ref, computed, templateRef, onInit } from '@li3/web';

          export default function () {
            const items = ref([]);
            const total = ref(0);
            const loading = ref(true);
            const selected = ref(null);
            const query = ref('');
            const type = ref('all');
            const view = ref('grid');
            const status = ref(null);
            const searchInput = templateRef('searchInput');
            let searchTimer;

            const scanStatusLabel = computed(() => status.value?.running ? 'Scanning' : status.value?.failed ? 'Review' : 'Ready');
            const resultLabel = computed(() => `${items.value.length} of ${total.value} ${total.value === 1 ? 'file' : 'files'}`);

            async function load() {
              loading.value = true;
              const params = new URLSearchParams({ limit: '60' });
              if (query.value) params.set('search', query.value);
              if (type.value !== 'all') params.set('type', type.value);
              try {
                const response = await fetch(`/api/media?${params}`);
                if (!response.ok) throw new Error('Could not load archive');
                const data = await response.json();
                items.value = data.items;
                total.value = data.total;
              } finally {
                loading.value = false;
              }
            }

            async function refresh() {
              const response = await fetch('/api/status');
              if (response.ok) status.value = await response.json();
              await load();
            }

            function onSearch(event) {
              query.value = event.target.value;
              clearTimeout(searchTimer);
              searchTimer = setTimeout(load, 250);
            }
            function setType(value) { type.value = value; load(); }
            function setView(value) { view.value = value; }
            function open(item) { selected.value = item; }
            function close() { selected.value = null; }
            function formatBytes(value) {
              if (!value) return '0 B';
              const units = ['B', 'KB', 'MB', 'GB'];
              const index = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
              return `${(value / 1024 ** index).toFixed(index ? 1 : 0)} ${units[index]}`;
            }
            function formatDate(value) {
              if (!value) return 'Unknown';
              const date = new Date(value);
              return Number.isNaN(date.valueOf()) ? value : new Intl.DateTimeFormat('en', { dateStyle: 'medium' }).format(date);
            }
            function typeGlyph(value) { return { audio: '♪', pdf: '▤', ebook: '▥', unknown: '•' }[value] || '•'; }
            function mapLink(lat, lon) { return `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=13/${lat}/${lon}`; }
            function mapUrl(lat, lon) { return `https://www.openstreetmap.org/export/embed.html?bbox=${lon - 0.08},${lat - 0.05},${Number(lon) + 0.08},${Number(lat) + 0.05}&layer=mapnik&marker=${lat},${lon}`; }

            onInit(async () => {
              const response = await fetch('/api/status');
              if (response.ok) status.value = await response.json();
              await load();
            });

            return { items, total, loading, selected, type, view, scanStatusLabel, resultLabel, searchInput, onSearch, setType, setView, refresh, open, close, formatBytes, formatDate, typeGlyph, mapLink, mapUrl };
          }
        </script>
      </main>
    </template>
  </body>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</html>
